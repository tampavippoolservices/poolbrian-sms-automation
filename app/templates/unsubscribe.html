<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Email preferences | Tampa VIP Pool Services</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; color: #172033; margin: 0; }
    main { max-width: 560px; margin: 64px auto; background: white; padding: 32px; border-radius: 12px; box-shadow: 0 8px 30px rgba(18, 40, 80, .08); }
    button { background: #b42318; color: white; border: 0; border-radius: 6px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
<main>
  {% if completed %}
    <h1>You are unsubscribed</h1>
    <p>We will no longer send review-request emails to this address.</p>
  {% else %}
    <h1>Unsubscribe from review emails?</h1>
    <p>This only stops review-request emails. It does not change essential service communication preferences.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Unsubscribe</button>
    </form>
  {% endif %}
</main>
</body>
</html>
