name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: automation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/automation_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/automation_test
      PUBLIC_BASE_URL: https://automation.example.com
      TOKEN_ENCRYPTION_KEY: YTmyeGG4aJ9iil9X2FwgVVqoUXE55aC1e0c7Om0eL88=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Install project without dependency resolution
        run: pip install --no-deps --no-build-isolation .
      - name: Verify dependency consistency
        run: pip check
      - name: Lint
        run: ruff check app migrations tests
      - name: Type check
        run: mypy app
      - name: Validate migrations
        run: alembic upgrade head
      - name: Test
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=40
      - name: Build distributable package
        run: python -m build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Audit installed dependencies
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements.lock
